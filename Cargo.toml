[workspace]
members = [
    "crates/*",
    "parseltongue",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["Parseltongue Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/that-in-rust/parseltongue"
homepage = "https://github.com/that-in-rust/parseltongue"
rust-version = "1.75"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

# CLI dependencies
clap = { version = "4.0", features = ["derive"] }
console = "0.15"
indicatif = "0.17"

# Storage dependencies
libsql = "0.6"
sha2 = "0.10"
walkdir = "2.5"

# HTTP server dependencies
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Parsing dependencies
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-kotlin = "0.3"
tree-sitter-scala = "0.24"

# Development dependencies
async-trait = "0.1"
criterion = "0.5"
proptest = "1.0"
tempfile = "3.0"
tokio-test = "0.4"

# Local workspace crates
parseltongue-core = { path = "crates/parseltongue-core" }
pt01-codebase-ingestion-engine = { path = "crates/pt01-codebase-ingestion-engine" }
pt08-http-query-api-server = { path = "crates/pt08-http-query-api-server" }
pt09-rustc-compiler-enrichment = { path = "crates/pt09-rustc-compiler-enrichment" }
